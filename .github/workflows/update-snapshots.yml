name: Generate browser snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: chown "$(id -u):$(id -g)" /github/home
      - run: npx playwright test --update-snapshots=changed
      - name: Package snapshots
        run: tar -czf browser-snapshots.tar.gz tests/e2e/*-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: browser-snapshots
          path: browser-snapshots.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
